[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-rag"
version = "0.1.0"
description = "Multi-tenant authentication backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
    "starlette>=1.6,<2",
    "pypdf>=6,<7",
    "beautifulsoup4>=4.14,<5",
    "langchain-text-splitters>=1,<2",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5,<6",
    "pgvector>=0.4,<1",
    "openai>=2,<3",
    "langgraph==1.2.15",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the explicitly configured dedicated PostgreSQL test database"]
